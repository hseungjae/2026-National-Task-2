kind: DaemonSet

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        Parser cri
        Tag kube.*
        Refresh_Interval 5
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

    [FILTER]
        Name grep
        Match kube.*
        Exclude $kubernetes['namespace_name'] wsc2026-logging

  outputs: |
    [OUTPUT]
        Name opentelemetry
        Match kube.*
        Host wsc2026-otel-collector-opentelemetry-collector.wsc2026-logging.svc.cluster.local
        Port 4318
        Logs_uri /v1/logs
        Log_response_payload true
        Tls Off
