config:
  service: |
    [SERVICE]
        Daemon         Off
        Flush          1
        Log_Level      info
        Parsers_File   parsers.conf
        Parsers_File   custom_parsers.conf
        HTTP_Server    On
        HTTP_Listen    0.0.0.0
        HTTP_Port      2020

  inputs: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        multiline.parser  cri
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            Off

  outputs: |
    [OUTPUT]
        Name                    loki
        Match                   *
        Host                    loki.logging.svc.cluster.local
        Port                    3100
        Labels                  job=fluentbit
        Auto_Kubernetes_Labels  On
